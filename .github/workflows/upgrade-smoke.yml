name: Upgrade Smoke Test

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  upgrade-smoke:
    name: Migrate old databases
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Ensure ffmpeg is available
        run: command -v ffmpeg && command -v ffprobe || sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run upgrade smoke test
        run: npm run smoke:upgrade
