name: TypeScript Ratchet

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  ratchet:
    name: checkJs error ratchet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check type-error ratchet
        run: npm run ratchet
